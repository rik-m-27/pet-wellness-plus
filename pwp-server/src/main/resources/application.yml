server:
  port: ${SERVER_PORT}

spring:
  profiles:
    active: local
# ===============================
# Application
# ===============================

  application:
    name: "Pet Wellness Plus"
  
# ===============================
# Datasource (MySQL)
# ===============================
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP
    hikari:
      pool-name: Hikari-PWP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000

# ===============================
# JPA / Hibernate
# ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
        # dialect: org.hibernate.dialect.MySQL8Dialect

# ===============================
# Redis
# ===============================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

#===============================
# Make console clean
#===============================
  main:
    banner-mode: log

# ===============================
# Json Web Token
# ===============================
jwt:
  secret: JWT_TOKEN
  expiration: 1h
  header: Authorization
  prefix: "Bearer "

# ===============================
# logger configuration
